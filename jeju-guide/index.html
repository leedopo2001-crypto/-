<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>서귀포 크루즈 여객 워크 가이드 — 화산 절벽과 폭포가 주는 낭만 코스</title>
<meta name="description" content="강정크루즈여객터미널에서 시작하는 서귀포 추천 산책 코스 · 크루즈 여객 워크 가이드" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#1a5f9c" />
<style>
  :root{
    --sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --serif:Georgia,"Times New Roman",Times,"Nanum Myeongjo",serif;
    --page:#ffffff;
    --parch:#f3e8cf;
    --parch-2:#ece0c2;
    --cell:#e9dcbe;
    --ink:#35322c;
    --ink-2:#5d574c;
    --muted:#8c8676;
    --navy:#1a5f9c;
    --navy-2:#14507f;
    --orange:#c15a2b;
    --orange-2:#a2461d;
    --line:#e2d8c0;
    --shadow:0 2px 4px rgba(80,60,30,.06),0 12px 30px -16px rgba(80,60,30,.3);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  a{color:var(--navy-2)}
  :focus-visible{outline:2.5px solid var(--orange);outline-offset:2px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  /* ---------- header ---------- */
  .top{border-bottom:1px solid var(--line)}
  .top-in{display:flex;align-items:center;gap:16px;padding:14px 0}
  .brand{line-height:1.1}
  .brand .lg{font-family:var(--serif);font-weight:700;font-size:clamp(24px,3vw,32px);color:var(--navy);letter-spacing:.02em}
  .brand .ko{font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);font-weight:600;margin-top:3px}
  .brand .cruise{font-size:12.5px;color:var(--orange);font-weight:700;font-style:italic;margin-top:2px}
  .top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
  .socials{display:flex;gap:10px}
  .socials a{color:var(--ink-2);display:grid;place-items:center}
  .socials svg{width:19px;height:19px}
  .lang{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.05em}
  .lang b{color:var(--navy)}
  .srch{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:none;cursor:pointer;color:var(--ink-2)}
  .srch svg{width:16px;height:16px}
  @media(max-width:680px){.socials,.lang{display:none}}

  .nav{border-bottom:2px solid var(--line)}
  .nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .nav-in a{flex:none;padding:14px 16px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;border-right:1px solid var(--line);white-space:nowrap}
  .nav-in a:first-child{border-left:1px solid var(--line)}
  .nav-in a:hover{color:var(--orange)}

  /* breadcrumb */
  .crumb{background:#f6f2ea;border-bottom:1px solid var(--line)}
  .crumb-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 0;font-size:12px;color:var(--muted)}
  .crumb-in a{color:var(--ink-2);text-decoration:none}
  .crumb-in a:hover{text-decoration:underline}
  .crumb-in .sep{color:var(--muted)}
  .crumb-in b{color:var(--ink)}

  /* ---------- intro ---------- */
  .intro{padding:40px 0 8px}
  .intro-grid{display:grid;grid-template-columns:1fr;gap:28px;align-items:start}
  @media(min-width:800px){.intro-grid{grid-template-columns:290px 1fr;gap:40px}}
  .scroll{position:relative;background:var(--parch);border:2px solid var(--orange);border-radius:6px;
    padding:34px 24px;text-align:center;box-shadow:var(--shadow);
    background-image:radial-gradient(circle at 20% 10%,rgba(193,90,43,.05),transparent 40%)}
  .scroll::before,.scroll::after{content:"";position:absolute;left:8px;right:8px;height:0;border-top:1px dashed rgba(193,90,43,.5)}
  .scroll::before{top:6px}.scroll::after{bottom:6px}
  .scroll .lead-lbl{font-family:var(--serif);font-size:11px;letter-spacing:.34em;color:var(--orange);font-weight:700}
  .scroll .big{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--navy);letter-spacing:.02em;margin:12px 0}
  .scroll .dot{height:1px;background:repeating-linear-gradient(90deg,var(--orange) 0 4px,transparent 4px 8px);margin:14px auto;width:70%;opacity:.6}
  .scroll .sm{font-family:var(--serif);font-size:15px;color:var(--ink-2);line-height:1.5}
  .story h2{font-family:var(--serif);font-weight:700;font-size:clamp(18px,2.4vw,22px);color:var(--ink);margin:0 0 4px;display:inline-block;
    border-bottom:2px solid var(--orange);padding-bottom:5px}
  .story .blk+.blk{margin-top:26px}
  .story p{margin:12px 0 0;color:var(--ink-2);font-size:15.5px;line-height:1.85}

  /* ---------- route map ---------- */
  .maprow{padding:34px 0 6px}
  .mapbox{border:1px solid var(--parch-2);border-radius:8px;overflow:hidden;background:var(--parch);box-shadow:var(--shadow)}
  .mapbox svg{display:block;width:100%;height:auto}
  .mapcap{font-size:12px;color:var(--muted);padding:12px 4px 0;text-align:center;font-style:italic}

  /* course selector */
  .courses{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:22px 0 4px}
  .cbtn{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--navy);background:var(--page);
    border:1px solid var(--navy);border-radius:3px;padding:8px 16px;cursor:pointer;letter-spacing:.03em;transition:.15s}
  .cbtn:hover{background:#eef4fa}
  .cbtn[aria-pressed="true"]{background:var(--navy);color:#fff}
  .csub{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}

  /* ---------- itinerary + detail ---------- */
  .course-body{padding:26px 0 10px}
  .cb-grid{display:grid;grid-template-columns:1fr;gap:26px;align-items:start}
  @media(min-width:860px){.cb-grid{grid-template-columns:300px 1fr;gap:34px}}

  .itin{background:var(--parch);border:1px solid var(--parch-2);border-radius:8px;padding:16px 14px}
  .itin .start{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px;color:var(--orange-2);padding:6px 4px 2px}
  .itin .start svg{width:18px;height:18px}
  .conn{display:flex;align-items:center;gap:8px;padding:6px 0 6px 16px;color:var(--muted);font-size:11.5px;font-weight:600}
  .conn .bar{width:2px;height:20px;background:var(--parch-2);margin-left:8px}
  .conn .chip{display:inline-flex;align-items:center;gap:5px;background:var(--page);border:1px solid var(--line);border-radius:4px;padding:3px 9px}
  .conn .chip svg{width:13px;height:13px;color:var(--navy)}
  .stop-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--page);border:1px solid var(--line);
    border-radius:6px;padding:11px 12px;cursor:pointer;transition:.15s}
  .stop-btn:hover{border-color:var(--navy)}
  .stop-btn[aria-current="true"]{border:2px solid var(--orange);box-shadow:0 4px 12px -6px rgba(193,90,43,.5)}
  .pin{flex:none;position:relative;width:26px;height:32px;color:var(--navy)}
  .pin svg{width:26px;height:32px}
  .pin b{position:absolute;top:3px;left:0;right:0;text-align:center;color:#fff;font-size:12px;font-weight:800}
  .stop-btn .nm{font-size:14px;font-weight:700;line-height:1.3}
  .stop-btn .star{margin-left:auto;color:var(--orange);font-size:13px}

  /* detail card with ornate frame */
  .detail{position:relative;border:2px solid var(--orange);border-radius:4px;padding:clamp(20px,3vw,32px);background:var(--page);
    box-shadow:0 0 0 4px var(--page),0 0 0 5px rgba(193,90,43,.35),var(--shadow)}
  .corner{position:absolute;width:34px;height:34px;color:var(--orange)}
  .corner.tl{top:-2px;left:-2px}
  .corner.tr{top:-2px;right:-2px;transform:scaleX(-1)}
  .corner.bl{bottom:-2px;left:-2px;transform:scaleY(-1)}
  .corner.br{bottom:-2px;right:-2px;transform:scale(-1,-1)}
  .dtitle{font-family:var(--serif);color:var(--orange);font-weight:700;font-size:clamp(19px,2.6vw,25px);letter-spacing:-.01em;line-height:1.25;margin:0;
    display:flex;align-items:center;gap:9px;border-bottom:1px dotted rgba(193,90,43,.5);padding-bottom:12px}
  .dtitle svg{width:18px;height:18px;flex:none;opacity:.8}
  .dcols{display:grid;grid-template-columns:1fr;gap:20px;margin-top:18px}
  @media(min-width:560px){.dcols{grid-template-columns:1fr 300px}}
  .dtext .lead{font-weight:800;font-size:15.5px;color:var(--ink);margin:0 0 10px;line-height:1.5}
  .dtext p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.8}
  .dphoto{position:relative}
  .dphoto img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
  .seal{position:absolute;top:10px;left:10px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.02em;
    padding:6px 8px;border-radius:50%;width:74px;height:74px;display:grid;place-content:center;text-align:center;line-height:1.25;
    box-shadow:0 4px 10px -3px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.7)}
  .dinfo{width:100%;border-collapse:collapse;margin-top:22px;font-size:13.5px;border-top:1px solid var(--line)}
  .dinfo th{background:var(--cell);color:var(--ink);font-weight:700;text-align:center;width:118px;padding:11px 10px;border-bottom:1px solid var(--page);vertical-align:middle;white-space:nowrap}
  .dinfo td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
  .dinfo td a{color:var(--navy-2);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
  .dinfo td .fac{display:flex;flex-wrap:wrap;gap:4px 12px}
  .dinfo td .fac span{font-size:12.5px}
  .dinfo td .fac .on{color:var(--navy-2);font-weight:600}
  .dinfo td .fac .off{color:var(--muted)}
  .free{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--orange);padding:1px 8px;border-radius:3px}
  .dbtn{display:block;text-align:center;margin:22px auto 0;max-width:280px;background:var(--orange);color:#fff;text-decoration:none;
    font-weight:700;font-size:14px;letter-spacing:.03em;padding:13px;border-radius:4px;transition:.15s}
  .dbtn:hover{background:var(--orange-2)}
  .dbtn span{margin-left:8px}

  footer{margin-top:48px;background:var(--navy);color:#dfe8f0;padding:28px 0}
  footer .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12.5px}
  footer .fl{font-family:var(--serif);font-size:18px;color:#fff;font-weight:700}
  footer .tt{margin-left:auto;color:#cdd; background:none;border:0;cursor:pointer;font-size:12.5px}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(30,22,10,.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lb.on{display:flex}.lb img{max-width:100%;max-height:100%;cursor:default;border-radius:3px}
  .lb .x{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;cursor:pointer;display:grid;place-items:center}
  .lb .x svg{width:20px;height:20px}
  [data-zoom]{cursor:zoom-in}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* stylized route map (parchment tone) */
function routeMap(c){
  const W=820,H=430,pts=[c.geo.start,...c.geo.stops];
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=` Q ${((x0+x1)/2).toFixed(0)} ${((y0+y1)/2-34).toFixed(0)} ${x1} ${y1}`;}
  const [sx,sy]=c.geo.start;
  let marks=`<g><circle cx="${sx}" cy="${sy}" r="14" fill="#fff" stroke="var(--navy)" stroke-width="2.5"/>
    <path d="M ${sx-6} ${sy-1} h12 l-2 5 h-8 z M ${sx} ${sy-8} v3 M ${sx-4} ${sy-5} h8" stroke="var(--navy)" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
    <text x="${sx}" y="${sy+31}" text-anchor="middle" class="mlbl mstart">강정항</text></g>`;
  c.geo.stops.forEach((p,i)=>{const [x,y]=p,above=y<195,ly=above?y-24:y+35;
    marks+=`<g><path d="M${x} ${y-16} c-8 0 -14 6 -14 13 0 9 14 20 14 20 s14 -11 14 -20 c0 -7 -6 -13 -14 -13z" fill="var(--orange)"/>
      <circle cx="${x}" cy="${y-3}" r="8" fill="#fff"/><text x="${x}" y="${y+2}" text-anchor="middle" class="mnum">${i+1}</text>
      <text x="${x}" y="${ly}" text-anchor="middle" class="mlbl">${MAP_LABEL[c.stops[i].slug]}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title} 이동 경로">
    <rect width="${W}" height="${H}" fill="var(--parch)"/>
    <path d="M0,300 C160,275 300,320 430,300 C560,282 690,318 ${W},296 L${W},${H} L0,${H} Z" fill="var(--navy)" fill-opacity="0.10"/>
    <path d="M0,300 C160,275 300,320 430,300 C560,282 690,318 ${W},296" fill="none" stroke="var(--navy)" stroke-opacity="0.4" stroke-width="1.5"/>
    <g stroke="var(--navy)" stroke-opacity="0.16" stroke-width="1.2" fill="none"><path d="M40,348 q22,-9 44,0 t44,0 t44,0 t44,0"/><path d="M560,362 q22,-9 44,0 t44,0 t44,0 t44,0"/></g>
    <path d="${d}" fill="none" stroke="var(--orange)" stroke-width="2.6" stroke-dasharray="2 7" stroke-linecap="round"/>
    ${marks}
    <g transform="translate(${W-48},46)" stroke="var(--ink-2)" fill="none" stroke-width="1.4"><circle r="15"/><path d="M0,-10 L4,3 L0,0 L-4,3 Z" fill="var(--ink-2)" stroke="none"/><text x="0" y="-18" text-anchor="middle" class="mcompass">N</text></g>
    <text x="24" y="${H-20}" class="mwm">SEOGWIPO</text>
  </svg>
  <style>.mnum{font:800 12px var(--sans);fill:var(--ink)}.mlbl{font:700 15px var(--sans);fill:var(--ink)}.mstart{font-weight:800}.mcompass{font:700 10px var(--sans);fill:var(--muted)}.mwm{font:italic 700 20px var(--serif);fill:var(--navy);opacity:.25;letter-spacing:.08em}</style>`;
}

}

  let h=`<div class="start">${svg(I.flag)}출발 · ${c.start}</div>`;
  c.stops.forEach((s,i)=>{
    const mode=s.transit.includes('도보')?'walk':'taxi';
    h+=`<div class="conn"><span class="bar"></span><span class="chip">${svg(I[mode])}${s.transit.replace('약 ','')} · ${s.dist}</span></div>`;
    h+=`<button class="stop-btn" data-si="${i}" aria-current="${i===state.si}">
      <span class="pin">${pinSVG}<b>${i+1}</b></span><span class="nm">${MAP_LABEL[s.slug]}</span><span class="star">★</span></button>`;
  });
  $('itin').innerHTML=h;
}

function facRow(s){
  return FAC_ORDER.filter(k=>s.fac[k]!==undefined).map(k=>{
    const on=s.fac[k][0]==='O';
    return `<span class="${on?'on':'off'}">${on?'✓':'✕'} ${FAC_LABEL[k]}</span>`;
  }).join('');
}

function renderDetail(c,i){
  const s=c.stops[i],tel=s.tel?s.tel.replace(/[^0-9+]/g,''):'',img=IMG(`img/${s.slug}-1.jpg`);
  $('detail').innerHTML=`<div class="detail">
    ${['tl','tr','bl','br'].map(p=>`<span class="corner ${p}">${svg(I.corner)}</span>`).join('')}
    <h3 class="dtitle">${svg(I.place)}${s.name}</h3>
    <div class="dcols">
      <div class="dtext"><p class="lead">${s.lead}</p><p>${s.desc}</p></div>
      <div class="dphoto"><img src="${img}" alt="${s.name}" data-zoom loading="lazy">${s.seal?`<span class="seal">${s.seal}</span>`:''}</div>
    </div>
    <table class="dinfo"><tbody>
      <tr><th>주소</th><td>${s.addr}</td></tr>
      <tr><th>이용시간</th><td>${s.hours}${s.free?' · <span class="free">무료</span>':''}</td></tr>
      <tr><th>가는 길</th><td>${s.near}${tel?` · <a href="tel:${tel}">${s.tel.replace('+82-','+82) ')}</a>`:''}</td></tr>
      <tr><th>편의시설</th><td><div class="fac">${facRow(s)}</div></td></tr>
    </tbody></table>
    ${s.url?`<a class="dbtn" href="${s.url}" target="_blank" rel="noopener">자세히 보기<span>→</span></a>`:''}
  </div>`;
}

function selectCourse(ci){
  state={ci,si:0};const c=COURSES[ci];
  document.querySelectorAll('#courses .cbtn').forEach((b,idx)=>b.setAttribute('aria-pressed',idx===ci));
  $('crumbCourse').textContent=c.title;
  $('csub').textContent=c.title;
  renderScrollStory(c);
  $('mapbox').innerHTML=routeMap(c);
  renderItin(c);
  renderDetail(c,0);
}

/* build course selector */
$('courses').innerHTML=COURSES.map((c,i)=>`<button class="cbtn" data-ci="${i}" aria-pressed="${i===0}">COURSE ${c.num}</button>`).join('');
$('courses').addEventListener('click',e=>{const b=e.target.closest('.cbtn');if(b)selectCourse(+b.dataset.ci);});
$('itin').addEventListener('click',e=>{const b=e.target.closest('.stop-btn');if(!b)return;
  state.si=+b.dataset.si;
  document.querySelectorAll('#itin .stop-btn').forEach(x=>x.setAttribute('aria-current',x===b));
  renderDetail(COURSES[state.ci],state.si);
});

selectCourse(0);

/* lightbox */
const lb=$('lb'),lbimg=$('lbimg');
document.body.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z&&z.tagName==='IMG'){lbimg.src=z.src;lb.classList.add('on');}});
const closeLb=()=>{lb.classList.remove('on');lbimg.src='';};
lb.addEventListener('click',e=>{if(e.target===lb||e.target.closest('.x'))closeLb();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
$('toTop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
</script>
</body>
</html>
