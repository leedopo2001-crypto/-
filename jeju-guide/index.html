<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>서귀포 하루 코스 · 강정크루즈여객터미널</title>
<meta name="description" content="강정크루즈여객터미널에서 시작하는 서귀포 4개 테마 코스 · 12개 명소 여행 가이드" />
<meta name="theme-color" content="#12161a" />
<style>
  /* ============ Tokens ============ */
  :root{
    --font-sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;

    /* course accents (hues chosen distinct but cohesive) */
    --c1:#0f9d8f;  /* 화산절벽·폭포 — jade */
    --c2:#2f74c0;  /* 물·치유 — ocean */
    --c3:#e9682c;  /* 액티비티 — tangerine */
    --c4:#d5457f;  /* MZ 예술 — rose */

    --brand:#e9682c;

    /* light ground (paper w/ slight teal bias) */
    --bg:#eef2f1;
    --bg2:#e4eae8;
    --surface:#ffffff;
    --surface-2:#f4f7f6;
    --border:#d8e0dd;
    --border-strong:#c3cecb;
    --text:#15201e;
    --text-2:#3d4a47;
    --muted:#66756f;
    --shadow:0 1px 2px rgba(20,40,36,.06),0 8px 24px -12px rgba(20,40,36,.18);
    --shadow-lg:0 12px 40px -16px rgba(20,40,36,.30);
    --ok:#0d8a5f;
    --ok-bg:#e4f4ec;
    --no:#9aa6a2;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1317;
      --bg2:#12171c;
      --surface:#171d23;
      --surface-2:#1e252c;
      --border:#2a323b;
      --border-strong:#3a444e;
      --text:#eef3f2;
      --text-2:#c2ccca;
      --muted:#8a9691;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
      --shadow-lg:0 20px 50px -20px rgba(0,0,0,.7);
      --c1:#22b6a6;--c2:#4f95df;--c3:#f2824a;--c4:#e56aa0;--brand:#f2824a;
      --ok:#3fce93;--ok-bg:#123528;--no:#5f6c67;
    }
  }
  :root[data-theme="light"]{
    --bg:#eef2f1;--bg2:#e4eae8;--surface:#ffffff;--surface-2:#f4f7f6;
    --border:#d8e0dd;--border-strong:#c3cecb;--text:#15201e;--text-2:#3d4a47;
    --muted:#66756f;--shadow:0 1px 2px rgba(20,40,36,.06),0 8px 24px -12px rgba(20,40,36,.18);
    --shadow-lg:0 12px 40px -16px rgba(20,40,36,.30);
    --c1:#0f9d8f;--c2:#2f74c0;--c3:#e9682c;--c4:#d5457f;--brand:#e9682c;
    --ok:#0d8a5f;--ok-bg:#e4f4ec;--no:#9aa6a2;
  }
  :root[data-theme="dark"]{
    --bg:#0f1317;--bg2:#12171c;--surface:#171d23;--surface-2:#1e252c;
    --border:#2a323b;--border-strong:#3a444e;--text:#eef3f2;--text-2:#c2ccca;
    --muted:#8a9691;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 20px 50px -20px rgba(0,0,0,.7);
    --c1:#22b6a6;--c2:#4f95df;--c3:#f2824a;--c4:#e56aa0;--brand:#f2824a;
    --ok:#3fce93;--ok-bg:#123528;--no:#5f6c67;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font-sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }
  a{color:inherit}
  button{font-family:inherit}
  :focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}

  .wrap{max-width:940px;margin:0 auto;padding:0 clamp(16px,4vw,28px)}

  /* ============ Header (sticky nav) ============ */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{display:flex;align-items:center;gap:12px;height:56px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
  .brand .mark{width:22px;height:22px;flex:none;color:var(--brand)}
  .brand small{color:var(--muted);font-weight:600;font-size:12px}
  .theme-btn{
    margin-left:auto;flex:none;width:38px;height:38px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface);color:var(--text-2);
    display:grid;place-items:center;cursor:pointer;transition:.18s;
  }
  .theme-btn:hover{border-color:var(--border-strong);color:var(--text)}
  .theme-btn svg{width:18px;height:18px}

  /* course tab strip */
  .tabs{
    position:sticky;top:56px;z-index:40;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .tabs-inner{display:flex;gap:7px;overflow-x:auto;padding:10px 0;scrollbar-width:none;scroll-snap-type:x proximity}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{
    scroll-snap-align:start;flex:none;cursor:pointer;
    border:1px solid var(--border);background:var(--surface);
    color:var(--text-2);border-radius:999px;padding:7px 14px 7px 11px;
    font-size:13.5px;font-weight:700;letter-spacing:-.01em;
    display:flex;align-items:center;gap:8px;transition:.16s;
  }
  .tab:hover{border-color:var(--border-strong)}
  .tab .dot{width:9px;height:9px;border-radius:50%;background:var(--ci);flex:none}
  .tab[aria-current="true"]{
    color:#fff;border-color:transparent;
    background:var(--ci);
  }
  .tab[aria-current="true"] .dot{background:rgba(255,255,255,.9)}

  /* ============ Hero ============ */
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 82% -10%, color-mix(in srgb,var(--c3) 26%,transparent), transparent 60%),
      radial-gradient(120% 100% at 0% 110%, color-mix(in srgb,var(--c1) 24%,transparent), transparent 55%);
  }
  .hero-inner{position:relative;z-index:2;padding-block:clamp(40px,9vw,86px) clamp(30px,6vw,52px)}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--brand);margin-bottom:18px;
  }
  .eyebrow::before{content:"";width:26px;height:2px;background:currentColor;border-radius:2px}
  h1.title{
    margin:0;font-size:clamp(34px,8vw,62px);line-height:1.04;font-weight:900;
    letter-spacing:-.03em;text-wrap:balance;
  }
  h1.title em{font-style:normal;color:var(--brand)}
  .lede{
    margin:20px 0 0;max-width:34em;font-size:clamp(15px,2.4vw,18px);
    color:var(--text-2);line-height:1.65;text-wrap:pretty;
  }
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  .stat{
    background:color-mix(in srgb,var(--surface) 78%,transparent);
    border:1px solid var(--border);border-radius:14px;padding:10px 16px;
    backdrop-filter:blur(6px);
  }
  .stat b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted);font-weight:600}

  /* ============ Course section ============ */
  .course{padding:clamp(34px,7vw,64px) 0;scroll-margin-top:112px}
  .course-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:8px}
  .course-num{
    flex:none;font-family:var(--font-mono);font-weight:700;font-size:13px;
    color:#fff;background:var(--ci);border-radius:11px;
    width:44px;height:44px;display:grid;place-items:center;letter-spacing:.02em;
    box-shadow:0 6px 16px -6px var(--ci);
  }
  .course-titles{min-width:0}
  .course-kicker{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--ci);text-transform:uppercase}
  .course h2{margin:2px 0 0;font-size:clamp(21px,4.4vw,29px);font-weight:900;letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
  .course-meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;color:var(--muted);font-size:13.5px;font-weight:600}
  .course-meta .m{display:inline-flex;align-items:center;gap:6px}
  .course-meta svg{width:15px;height:15px;color:var(--ci)}

  /* origin chip */
  .origin{
    display:inline-flex;align-items:center;gap:9px;margin:22px 0 4px;
    font-size:13.5px;font-weight:700;color:var(--text-2);
    background:var(--surface);border:1px dashed var(--border-strong);
    padding:8px 14px;border-radius:12px;
  }
  .origin .anchor{width:9px;height:9px;border-radius:50%;border:3px solid var(--ci);background:var(--surface)}

  /* ============ Timeline ============ */
  .timeline{position:relative;margin-top:6px;padding-left:26px}
  .timeline::before{
    content:"";position:absolute;left:8px;top:6px;bottom:34px;width:2px;
    background:linear-gradient(var(--ci),color-mix(in srgb,var(--ci) 20%,var(--border)));
    border-radius:2px;
  }
  .transit{
    position:relative;display:flex;align-items:center;gap:7px;
    padding:9px 0 9px 0;margin-left:-2px;color:var(--muted);
    font-size:12.5px;font-weight:600;
  }
  .transit .ic{width:15px;height:15px;color:var(--ci);flex:none}
  .transit::before{
    content:"";position:absolute;left:-18px;top:50%;width:8px;height:8px;
    transform:translateY(-50%);border-radius:50%;background:var(--border-strong);
  }

  .stop{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .18s,box-shadow .18s;
  }
  .stop::before{
    content:"";position:absolute;left:-22px;top:24px;width:14px;height:14px;
    border-radius:50%;background:var(--surface);border:3px solid var(--ci);z-index:1;
  }
  .stop.open{border-color:color-mix(in srgb,var(--ci) 45%,var(--border));box-shadow:var(--shadow-lg)}
  .stop-btn{
    width:100%;text-align:left;background:none;border:0;cursor:pointer;
    display:flex;align-items:center;gap:14px;padding:16px 16px;
  }
  .stop-idx{
    flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    font-family:var(--font-mono);font-weight:700;font-size:14px;
    color:var(--ci);background:color-mix(in srgb,var(--ci) 12%,transparent);
  }
  .stop-main{flex:1;min-width:0}
  .stop-name{font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .stop-tag{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .25s}
  .stop.open .chev{transform:rotate(180deg)}

  .stop-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .stop.open .stop-body{grid-template-rows:1fr}
  .stop-body>div{overflow:hidden;min-height:0}
  .stop-inner{padding:2px 16px 18px;border-top:1px solid var(--border)}
  .stop-desc{color:var(--text-2);font-size:14.5px;line-height:1.72;margin:16px 0 0;text-wrap:pretty}

  /* info rows */
  .info{margin-top:16px;display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .info .row{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--surface);padding:10px 14px}
  .info .row .k{color:var(--muted);font-size:12.5px;font-weight:700;padding-top:1px}
  .info .row .v{font-size:13.5px;color:var(--text);word-break:break-word}
  .info .row .v .note{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .info .row .v a{color:var(--ci);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
  .info .row .v a:hover{text-decoration:underline}
  .free{display:inline-block;font-size:11.5px;font-weight:800;color:var(--ok);background:var(--ok-bg);padding:2px 8px;border-radius:999px}

  /* actions */
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .act{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    font-size:13px;font-weight:700;padding:9px 14px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface-2);color:var(--text);transition:.15s;
  }
  .act:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .act.primary{background:var(--ci);border-color:transparent;color:#fff}
  .act.primary:hover{filter:brightness(1.06)}
  .act svg{width:15px;height:15px}
  .act[aria-disabled="true"]{opacity:.45;pointer-events:none}

  /* facilities */
  .fac-title{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
  .fac-title::after{content:"";flex:1;height:1px;background:var(--border)}
  .facs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .fac{
    display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:11px;
    border:1px solid var(--border);background:var(--surface-2);
  }
  .fac.on{border-color:color-mix(in srgb,var(--ok) 40%,var(--border));background:var(--ok-bg)}
  .fac .badge{
    flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
    background:var(--no);color:#fff;margin-top:1px;
  }
  .fac.on .badge{background:var(--ok)}
  .fac .badge svg{width:13px;height:13px}
  .fac .ftxt{min-width:0}
  .fac .fname{font-size:13px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:6px}
  .fac .fname svg{width:14px;height:14px;color:var(--muted);flex:none}
  .fac.on .fname svg{color:var(--ok)}
  .fac .fnote{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}

  .disclaimer{margin:14px 2px 0;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
  .disclaimer svg{width:14px;height:14px;flex:none;margin-top:2px}

  /* ============ footer ============ */
  footer{border-top:1px solid var(--border);padding:34px 0 46px;color:var(--muted);font-size:13px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
  footer b{color:var(--text-2)}
  .totop{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;color:var(--muted);font-weight:700;font-size:13px}
  .totop:hover{color:var(--text)}
  .totop svg{width:15px;height:15px}

  @media (min-width:560px){
    .info .row{grid-template-columns:92px 1fr}
    .stop-name{font-size:17.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  }
  html{scroll-behavior:smooth}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 17c2 0 2-1.4 4-1.4S9 17 11 17s2-1.4 4-1.4S17 17 19 17s2-1.4 2-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 13.5V7l6-3 6 3v6.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="11" cy="8.5" r="1.4" fill="currentColor"/></svg>
      서귀포 하루 코스 <small>· 강정크루즈터미널</small>
    </span>
    <button class="theme-btn" id="themeBtn" aria-label="밝은/어두운 테마 전환" title="테마 전환"></button>
  </div>
</header>

<nav class="tabs" aria-label="코스 바로가기">
  <div class="wrap tabs-inner" id="tabs"></div>
</nav>

<section class="hero">
  <canvas id="hexcanvas" aria-hidden="true"></canvas>
  <div class="wrap hero-inner">
    <span class="eyebrow">강정크루즈여객터미널 · 서귀포</span>
    <h1 class="title">바다에서 내려,<br><em>서귀포</em>의 하루를 걷다</h1>
    <p class="lede">크루즈에서 막 내린 당신을 위한 4개의 테마 코스. 화산 절벽과 폭포, 치유의 물길, 짜릿한 액티비티, 그리고 예술과 먹거리까지 — 터미널에서 가까운 순서대로 담았습니다.</p>
    <div class="stats">
      <div class="stat"><b>4</b><span>테마 코스</span></div>
      <div class="stat"><b>12</b><span>추천 명소</span></div>
      <div class="stat"><b>4시간~</b><span>반나절 코스</span></div>
    </div>
  </div>
</section>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>자료 출처 · <b>강정크루즈여객터미널 관광 안내</b></span>
    <span>운영시간·요금은 방문 전 각 명소 홈페이지에서 확인하세요.</span>
    <button class="totop" id="toTop">맨 위로
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</footer>

<script>
/* ============ Icons ============ */
const I = {
  taxi:'<path d="M5 11l1.5-4.2A2 2 0 018.4 5.5h7.2a2 2 0 011.9 1.3L19 11m-14 0h14m-14 0a2 2 0 00-2 2v3a1 1 0 001 1h1m14-6a2 2 0 012 2v3a1 1 0 01-1 1h-1M7 17h10M6.5 14h.01M17.5 14h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  walk:'<path d="M13 5.5a1.6 1.6 0 100-3.2 1.6 1.6 0 000 3.2zM10 21l2-5-2.2-2.2.7-4.3 3.3 1.3 1.4 2.7M12 16l2.4 5M11.2 9.5L8 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  clock:'<circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.6V12l3 1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  pin:'<path d="M12 21s6.5-5.7 6.5-10.2A6.5 6.5 0 105.5 10.8C5.5 15.3 12 21 12 21z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="10.6" r="2.4" stroke="currentColor" stroke-width="1.7"/>',
  phone:'<path d="M6.5 3.5h3l1.3 4-2 1.4a11 11 0 005.3 5.3l1.4-2 4 1.3v3a2 2 0 01-2.2 2A16.5 16.5 0 014.5 5.7 2 2 0 016.5 3.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  link:'<path d="M10 13.5a3.5 3.5 0 005 0l2.5-2.5a3.5 3.5 0 00-5-5L11 7.5M14 10.5a3.5 3.5 0 00-5 0L6.5 13a3.5 3.5 0 005 5L13 16.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  chev:'<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  check:'<path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
  x:'<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',

        <span class="badge">${svg(on?I.check:I.x)}</span>
        <span class="ftxt">
          <span class="fname">${svg(I[f.icon])}${f.name}</span>
          ${note?`<span class="fnote">${note}</span>`:''}
        </span>
      </div>`;
    }).join('');

    const rows=[];
    rows.push(`<div class="row"><span class="k">주소</span><span class="v">${s.addr}</span></div>`);
    rows.push(`<div class="row"><span class="k">운영시간</span><span class="v">${s.hours?s.hours:'상세 정보 없음'}${s.hoursNote?`<span class="note">※ ${s.hoursNote}</span>`:''}</span></div>`);
    if(s.tel) rows.push(`<div class="row"><span class="k">전화</span><span class="v">${s.tel.replace(/-/g,'-')}${s.telNote?`<span class="note">${s.telNote}</span>`:''}</span></div>`);
    if(s.free) rows.push(`<div class="row"><span class="k">이용요금</span><span class="v"><span class="free">무료</span></span></div>`);
    if(s.url) rows.push(`<div class="row"><span class="k">홈페이지</span><span class="v"><a href="${s.url}" target="_blank" rel="noopener">공식 안내 페이지 열기</a></span></div>`);

    const mapQ=encodeURIComponent(s.name+' '+s.addr);
    const telClean=s.tel?s.tel.replace(/[^0-9+]/g,''):'';

    return `<div class="transit">${svg(I[s.transit.mode==='taxi'?'taxi':'walk'],'ic')}${s.transit.t}</div>
    <article class="stop" data-stop>
      <button class="stop-btn" aria-expanded="false">
        <span class="stop-idx">${si+1}</span>
        <span class="stop-main">
          <span class="stop-name">${s.name}</span>
          <span class="stop-tag">${s.tag}</span>
        </span>
        ${svg(I.chev,'chev')}
      </button>
      <div class="stop-body"><div><div class="stop-inner">
        <p class="stop-desc">${s.desc}</p>
        <div class="info">${rows.join('')}</div>
        <div class="actions">
          <a class="act primary" href="https://map.kakao.com/?q=${mapQ}" target="_blank" rel="noopener">${svg(I.pin)}지도에서 보기</a>
          <a class="act" ${telClean?`href="tel:${telClean}"`:'aria-disabled="true"'}>${svg(I.phone)}전화</a>
          ${s.url?`<a class="act" href="${s.url}" target="_blank" rel="noopener">${svg(I.link)}홈페이지</a>`:''}
        </div>
        <div class="fac-title">편의시설 · 서비스</div>
        <div class="facs">${facHTML}</div>
        <p class="disclaimer">${svg(I.info)}O/X 정보와 운영시간은 자료 기준이며, 변동될 수 있습니다. 방문 전 홈페이지·전화로 확인하세요.</p>
      </div></div></div>
    </article>`;
  }).join('');

  sec.innerHTML=`
    <div class="wrap">
      <div class="course-head">
        <span class="course-num">${c.num}</span>
        <div class="course-titles">
          <div class="course-kicker">${c.kicker}</div>
          <h2>${c.title}</h2>
        </div>
      </div>
      <div class="origin"><span class="anchor"></span>출발 · ${c.origin}</div>
      <div class="timeline">${stopsHTML}</div>
    </div>`;
  app.appendChild(sec);
});

/* ============ Accordion ============ */
app.addEventListener('click',e=>{
  const btn=e.target.closest('.stop-btn');
  if(!btn)return;
  const stop=btn.closest('.stop');
  const open=stop.classList.toggle('open');
  btn.setAttribute('aria-expanded',open);
});

/* ============ Scrollspy tabs ============ */
const tabLinks=[...tabsEl.querySelectorAll('.tab')];
const secs=[...document.querySelectorAll('.course')];
const spy=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      const id=en.target.id;
      tabLinks.forEach(t=>t.setAttribute('aria-current',t.dataset.course===id));
      const active=tabLinks.find(t=>t.dataset.course===id);
      if(active) active.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    }
  });
},{rootMargin:'-45% 0px -50% 0px'});
secs.forEach(s=>spy.observe(s));

document.getElementById('toTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* ============ Theme toggle ============ */
const root=document.documentElement,tb=document.getElementById('themeBtn');
function currentDark(){
  const set=root.getAttribute('data-theme');
  if(set) return set==='dark';
  return matchMedia('(prefers-color-scheme:dark)').matches;
}
function paintThemeBtn(){tb.innerHTML=svg(currentDark()?I.sun:I.moon);}
tb.addEventListener('click',()=>{
  root.setAttribute('data-theme',currentDark()?'light':'dark');
  paintThemeBtn();drawHex();
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{paintThemeBtn();drawHex();});
paintThemeBtn();

/* ============ Hero basalt-hexagon canvas ============ */
const cv=document.getElementById('hexcanvas'),ctx=cv.getContext('2d');
function drawHex(){
  const host=cv.parentElement,dpr=Math.min(devicePixelRatio||1,2);
  const w=host.clientWidth,h=host.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const dark=currentDark();
  ctx.strokeStyle=dark?'rgba(120,200,190,.16)':'rgba(20,90,80,.10)';
  ctx.lineWidth=1;
  const R=27,dx=R*1.5,dy=R*Math.sqrt(3);
  for(let col=-1,x=0;x<w+R;col++,x=col*dx){
    const off=(col%2)?dy/2:0;
    for(let y=-R;y<h+R;y+=dy){
      hexAt(x,y+off,R);
    }
  }
}
function hexAt(cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i);
    const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();ctx.stroke();
}
addEventListener('resize',drawHex);
drawHex();
</script>
