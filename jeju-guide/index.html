<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>강정크루즈여객터미널 서귀포 관광 안내</title>
<meta name="description" content="강정크루즈여객터미널에서 출발하는 서귀포 4개 테마 코스·12개 명소 관광 안내" />
<meta name="theme-color" content="#0f4d45" />
<style>
  :root{
    --font-sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

    --bg:#f4f6f3;
    --surface:#ffffff;
    --surface-2:#eef1ec;
    --border:#dfe3dc;
    --border-strong:#c8cec1;
    --ink:#1b2320;
    --ink-2:#414a44;
    --muted:#6d766e;
    --accent:#0f6a5e;
    --accent-2:#0c574d;
    --accent-soft:#e3efec;
    --ok:#0f7a52;
    --ok-bg:#e6f3ec;
    --no:#9aa39b;
    --no-bg:#f0f1ee;
    --shadow:0 1px 2px rgba(20,40,34,.05),0 6px 18px -10px rgba(20,40,34,.16);
    --shadow-lg:0 18px 44px -22px rgba(20,40,34,.4);
    --tablehdr:#eef1ec;
    --thead:#0f4d45;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#101311;--surface:#181c19;--surface-2:#1f2420;--border:#2a302a;--border-strong:#3a423a;
      --ink:#eef2ee;--ink-2:#c3ccc4;--muted:#8a938b;--accent:#39b39f;--accent-2:#2f9d8b;
      --accent-soft:#12312b;--ok:#3fca92;--ok-bg:#123227;--no:#5d665e;--no-bg:#20251f;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6);
      --shadow-lg:0 22px 54px -26px rgba(0,0,0,.75);--tablehdr:#20251f;--thead:#123c35;
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f6f3;--surface:#ffffff;--surface-2:#eef1ec;--border:#dfe3dc;--border-strong:#c8cec1;
    --ink:#1b2320;--ink-2:#414a44;--muted:#6d766e;--accent:#0f6a5e;--accent-2:#0c574d;
    --accent-soft:#e3efec;--ok:#0f7a52;--ok-bg:#e6f3ec;--no:#9aa39b;--no-bg:#f0f1ee;
    --shadow:0 1px 2px rgba(20,40,34,.05),0 6px 18px -10px rgba(20,40,34,.16);
    --shadow-lg:0 18px 44px -22px rgba(20,40,34,.4);--tablehdr:#eef1ec;--thead:#0f4d45;
  }
  :root[data-theme="dark"]{
    --bg:#101311;--surface:#181c19;--surface-2:#1f2420;--border:#2a302a;--border-strong:#3a423a;
    --ink:#eef2ee;--ink-2:#c3ccc4;--muted:#8a938b;--accent:#39b39f;--accent-2:#2f9d8b;
    --accent-soft:#12312b;--ok:#3fca92;--ok-bg:#123227;--no:#5d665e;--no-bg:#20251f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.6);
    --shadow-lg:0 22px 54px -26px rgba(0,0,0,.75);--tablehdr:#20251f;--thead:#123c35;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);
    line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  img{max-width:100%;display:block}
  a{color:var(--accent-2)}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
  .wrap{max-width:900px;margin:0 auto;padding:0 clamp(16px,4vw,26px)}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);
    backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);
    border-bottom:1px solid var(--border)}
  .topbar-inner{display:flex;align-items:center;gap:10px;height:54px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;letter-spacing:-.01em}
  .logo .mk{width:26px;height:26px;flex:none;color:var(--accent);border:1.5px solid currentColor;border-radius:7px;display:grid;place-items:center}
  .logo .mk svg{width:16px;height:16px}
  .logo small{color:var(--muted);font-weight:600}
  .tbtn{margin-left:auto;width:37px;height:37px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
  .tbtn:hover{color:var(--ink);border-color:var(--border-strong)}
  .tbtn svg{width:18px;height:18px}

  /* ---- course tab strip ---- */
  .tabs{position:sticky;top:54px;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);
    border-bottom:1px solid var(--border)}
  .tabs-inner{display:flex;gap:6px;overflow-x:auto;padding:9px 0;scrollbar-width:none}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{flex:none;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;letter-spacing:-.01em;
    display:flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;transition:.15s}
  .tab:hover{border-color:var(--border-strong)}
  .tab .n{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--accent)}
  .tab[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab[aria-current="true"] .n{color:rgba(255,255,255,.85)}

  /* ---- masthead ---- */
  .masthead{position:relative;overflow:hidden;border-bottom:1px solid var(--border);background:#0c3d37}
  .masthead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}
  .masthead::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(8,40,36,.35),rgba(8,36,32,.78))}
  .mh-in{position:relative;z-index:2;color:#fff;padding:clamp(38px,8vw,70px) 0 clamp(30px,5vw,46px)}
  .mh-kicker{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#a7ddd1;margin-bottom:14px}
  .mh-in h1{margin:0;font-size:clamp(26px,6vw,42px);font-weight:900;letter-spacing:-.025em;
    line-height:1.18;text-wrap:balance}
  .mh-in p{margin:14px 0 0;max-width:36em;color:#dceee9;font-size:clamp(14px,2.3vw,16.5px);line-height:1.6}
  .mh-meta{display:flex;gap:22px;margin-top:24px;flex-wrap:wrap}
  .mh-meta div b{display:block;font-size:clamp(22px,5vw,30px);font-weight:900;line-height:1;letter-spacing:-.02em}
  .mh-meta div span{font-size:12.5px;color:#a7ddd1;font-weight:600}

  /* ---- course ---- */
  .course{padding:clamp(34px,6vw,58px) 0 8px;scroll-margin-top:108px}
  .course + .course{border-top:1px solid var(--border)}
  .c-head{display:flex;gap:13px;align-items:baseline}
  .c-num{flex:none;font-family:var(--font-mono);font-weight:700;font-size:15px;color:#fff;
    background:var(--accent);border-radius:8px;padding:5px 9px;letter-spacing:.02em;align-self:flex-start}
  .c-kicker{font-size:12.5px;font-weight:700;color:var(--accent-2);letter-spacing:.02em}
  .course h2{margin:2px 0 0;font-size:clamp(20px,4vw,27px);font-weight:900;letter-spacing:-.02em;line-height:1.22;text-wrap:balance}

  /* route map + summary */
  .routemap{margin:20px 0 6px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
  .routemap figcaption{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px}
  .routemap figcaption svg{width:14px;height:14px;color:var(--accent)}
  .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:16px 0 4px;
    padding:13px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
    font-size:13px;font-weight:700}
  .route .node{color:var(--ink);white-space:nowrap}
  .route .node.start{color:var(--accent-2)}
  .route .leg{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
  .route .leg svg{width:14px;height:14px;color:var(--accent);flex:none}

  /* ---- place ---- */
  .place{margin:30px 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:108px}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--border)}
  .gallery button{border:0;padding:0;margin:0;cursor:zoom-in;background:var(--surface-2);display:block;overflow:hidden}
  .gallery img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .4s}
  .gallery button:hover img{transform:scale(1.035)}
  .p-body{padding:clamp(18px,3.5vw,26px)}
  .p-num{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent-2);margin-bottom:8px}
  .p-num .b{font-family:var(--font-mono);background:var(--accent-soft);color:var(--accent-2);
    width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12.5px}
  .place h3{margin:0;font-size:clamp(20px,4vw,25px);font-weight:900;letter-spacing:-.02em;line-height:1.25}
  .p-tag{margin:6px 0 0;color:var(--muted);font-size:13.5px;font-weight:600}
  .p-desc{margin:16px 0 0;color:var(--ink-2);font-size:15px;line-height:1.78;text-wrap:pretty}

  /* info table */
  .tbl{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .tbl caption{caption-side:top;text-align:left;font-size:12px;font-weight:800;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);padding:0 0 8px}
  .tbl th,.tbl td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top}
  .tbl .rowh{background:var(--tablehdr);color:var(--ink);font-weight:700;width:104px;white-space:nowrap}
  .tbl td a{color:var(--accent-2);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
  .tbl td a:hover{text-decoration:underline}
  .tbl .note{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .free{display:inline-block;font-size:12px;font-weight:800;color:var(--ok);background:var(--ok-bg);padding:2px 9px;border-radius:6px}

  /* facility (O/X) table — faithful to source */
  .facwrap{margin-top:18px;overflow-x:auto}
  .fac{width:100%;min-width:460px;border-collapse:collapse;font-size:13px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .fac thead th{background:var(--thead);color:#fff;font-weight:700;padding:9px 12px;text-align:left;font-size:12.5px;letter-spacing:.01em}
  .fac thead th.c-ox{text-align:center;width:64px}
  .fac thead th.c-note{width:34%}
  .fac td,.fac th{border:1px solid var(--border);padding:9px 12px;vertical-align:middle}
  .fac .grp{background:var(--tablehdr);font-weight:800;width:118px;white-space:nowrap;color:var(--ink);vertical-align:middle}
  .fac .item{color:var(--ink-2)}
  .fac .ox{text-align:center;font-weight:800;width:64px}
  .fac .ox .badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff}
  .fac .ox.on .badge{background:var(--ok)}
  .fac .ox.off .badge{background:var(--no)}
  .fac .ox .badge svg{width:14px;height:14px}
  .fac .bigo{color:var(--muted);font-size:12.5px}
  .fac tbody tr:nth-child(even) td.item,.fac tbody tr:nth-child(even) td.bigo{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}

  /* actions */
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .act{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);transition:.15s}
  .act:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .act.primary:hover{background:var(--accent-2)}
  .act svg{width:15px;height:15px}
  .act[aria-disabled="true"]{opacity:.45;pointer-events:none}

  .note-src{margin:14px 2px 0;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
  .note-src svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--muted)}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(6,18,15,.9);display:none;
    align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);cursor:default}
  .lb .close{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:0;
    background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}
  .lb .close svg{width:20px;height:20px}

  footer{border-top:1px solid var(--border);padding:32px 0 46px;margin-top:26px;color:var(--muted);font-size:13px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
  footer b{color:var(--ink-2)}
  .totop{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;color:var(--muted);font-weight:700;font-size:13px}
  .totop:hover{color:var(--ink)}
  .totop svg{width:15px;height:15px}

  @media (max-width:520px){
    .gallery{grid-template-columns:1fr}
    .gallery img{aspect-ratio:16/10}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="logo">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 17c1.6 0 1.6-1.2 3.2-1.2S7.8 17 9.4 17 11 15.8 12.6 15.8 14.2 17 15.8 17s1.6-1.2 3.2-1.2S20.6 17 22 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5.5 13V7.2L12 4l6.5 3.2V13" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      강정크루즈여객터미널 <small>· 서귀포 관광 안내</small>
    </span>
    <button class="tbtn" id="themeBtn" aria-label="밝은/어두운 테마 전환" title="테마 전환"></button>
  </div>
</header>

<nav class="tabs" aria-label="코스 바로가기"><div class="wrap tabs-inner" id="tabs"></div></nav>

<section class="masthead">
  <img src="img/jungmun-beach-1.jpg" alt="" aria-hidden="true" fetchpriority="high" />
  <div class="wrap mh-in">
    <div class="mh-kicker">서귀포 · 강정크루즈여객터미널</div>
    <h1>크루즈에서 내려 즐기는<br>서귀포 추천 코스</h1>
    <p>강정크루즈여객터미널에서 출발해 반나절 동안 돌아볼 수 있는 4개 테마 코스와 12곳의 명소를 안내합니다. 각 명소의 사진과 소개, 운영 정보, 편의시설 현황을 함께 담았습니다.</p>
    <div class="mh-meta">
      <div><b>4</b><span>테마 코스</span></div>
      <div><b>12</b><span>추천 명소</span></div>
      <div><b>4시간~</b><span>반나절 코스</span></div>
    </div>
  </div>
</section>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>자료 출처 · <b>강정크루즈여객터미널 관광 안내</b></span>
    <span>운영시간·이용요금은 방문 전 각 명소 홈페이지에서 확인하시기 바랍니다.</span>
    <button class="totop" id="toTop">맨 위로 <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="close" id="lbClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <img id="lbImg" src="" alt="" />
</div>

<script>
const I={
  taxi:'<path d="M5 11l1.4-3.9A1.9 1.9 0 018.2 5.8h7.6a1.9 1.9 0 011.8 1.3L19 11m-14 0h14m-14 0a1.8 1.8 0 00-1.8 1.8v2.7a.9.9 0 00.9.9h1m13.8-5.4a1.8 1.8 0 011.8 1.8v2.7a.9.9 0 01-.9.9h-1M7.5 16.4h9M7 14h.01M17 14h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  walk:'<path d="M13.2 5.4a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM10.2 21l1.9-4.8-2.1-2.1.7-4.1 3.1 1.2 1.4 2.6M12 15.9l2.3 5.1M11.4 9.3L8.4 10.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  arrow:'<path d="M5 12h13m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  pin:'<path d="M12 21s6.4-5.6 6.4-10.1A6.4 6.4 0 105.6 10.9C5.6 15.4 12 21 12 21z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="10.6" r="2.3" stroke="currentColor" stroke-width="1.7"/>',
  phone:'<path d="M6.5 3.5h3l1.3 4-2 1.4a11 11 0 005.3 5.3l1.4-2 4 1.3v3a2 2 0 01-2.2 2A16.5 16.5 0 014.5 5.7 2 2 0 016.5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  link:'<path d="M10 13.5a3.5 3.5 0 005 0l2.5-2.5a3.5 3.5 0 00-5-5L11 7.5M14 10.5a3.5 3.5 0 00-5 0L6.5 13a3.5 3.5 0 005 5L13 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  map:'<path d="M9 3.5L3.5 6v14.5L9 18l6 2.5 5.5-2.5V3.5L15 6 9 3.5zM9 3.5V18M15 6v14.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
  check:'<path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
  x:'<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
  info:'<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  sun:'<circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.5M12 19v2.5M4.3 4.3l1.8 1.8M17.9 17.9l1.8 1.8M2.5 12H5M19 12h2.5M4.3 19.7l1.8-1.8M17.9 6.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  moon:'<path d="M20 13.5A8 8 0 019.7 4 7 7 0 1020 13.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'
};
const svg=(p,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${p}</svg>`;

/* facility item catalog (grouped, faithful to source) */
const FAC_GROUPS=[
  {g:'정보제공',items:[

const app=document.getElementById('app'),tabsEl=document.getElementById('tabs');

function facTable(s){
  let rows='';
  FAC_GROUPS.forEach(gr=>{
    const present=gr.items.filter(([k])=>s.fac[k]!==undefined);
    if(!present.length)return;
    present.forEach(([k,label],i)=>{
      const v=s.fac[k],on=v[0]==='O',note=v[1]||'';
      rows+=`<tr>`;
      if(i===0) rows+=`<td class="grp" rowspan="${present.length}">${gr.g}</td>`;
      rows+=`<td class="item">${label}</td>
        <td class="ox ${on?'on':'off'}"><span class="badge">${svg(on?I.check:I.x)}</span></td>
        <td class="bigo">${note}</td></tr>`;
    });
  });
  return `<div class="facwrap"><table class="fac">
    <thead><tr><th>항목</th><th>세부내용</th><th class="c-ox">O/X</th><th class="c-note">비고</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

      <div class="acts">
        <a class="act primary" href="https://map.kakao.com/?q=${mapQ}" target="_blank" rel="noopener">${svg(I.pin)}지도에서 보기</a>
        <a class="act" ${tel?`href="tel:${tel}"`:'aria-disabled="true"'}>${svg(I.phone)}전화</a>
        ${s.url?`<a class="act" href="${s.url}" target="_blank" rel="noopener">${svg(I.link)}홈페이지</a>`:''}
      </div>
      <p class="note-src">${svg(I.info)}O/X 및 운영 정보는 안내 자료 기준이며 변동될 수 있습니다. 방문 전 홈페이지·전화로 확인하시기 바랍니다.</p>
    </div>
  </article>`;
}

COURSES.forEach(c=>{
  const tab=document.createElement('a');
  tab.className='tab';tab.href='#'+c.id;tab.dataset.course=c.id;
  tab.innerHTML=`<span class="n">${c.num}</span>${c.kicker}`;
  tabsEl.appendChild(tab);

  // route strip: start -> stop1 -(leg)- stop2 ...
  let route=`<span class="node start">${c.start}</span>`;
  c.stops.forEach(s=>{
    route+=`<span class="leg">${svg(I[s.transit.m])}${s.transit.t}</span>${svg(I.arrow,'')}<span class="node">${s.name}</span>`;
  });

  const sec=document.createElement('section');
  sec.className='course';sec.id=c.id;
  sec.innerHTML=`<div class="wrap">
    <div class="c-head">
      <span class="c-num">${c.num}</span>
      <div><div class="c-kicker">${c.kicker}</div><h2>${c.title}</h2></div>
    </div>
    <figure class="routemap"><img src="${c.map}" alt="${c.title} 이동 경로 지도" loading="lazy" />
      <figcaption>${svg(I.map)}${c.start}에서 출발하는 이동 경로</figcaption></figure>
    <div class="route">${route}</div>
    ${c.stops.map((s,i)=>placeCard(s,i+1)).join('')}
  </div>`;
  app.appendChild(sec);
});

/* lightbox */
const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg');
app.addEventListener('click',e=>{
  const b=e.target.closest('.gallery button');if(!b)return;
  lbImg.src=b.dataset.full;lbImg.alt=b.querySelector('img').alt;lb.classList.add('on');
});
function closeLb(){lb.classList.remove('on');lbImg.src='';}
lb.addEventListener('click',e=>{if(e.target===lb||e.target.closest('.close'))closeLb();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});

/* scrollspy */
const tabLinks=[...tabsEl.querySelectorAll('.tab')];
const spy=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){
  const id=en.target.id;tabLinks.forEach(t=>t.setAttribute('aria-current',t.dataset.course===id));
  const a=tabLinks.find(t=>t.dataset.course===id);if(a)a.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}});},{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('.course').forEach(s=>spy.observe(s));
document.getElementById('toTop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));

/* theme */
const root=document.documentElement,tb=document.getElementById('themeBtn');
const isDark=()=>{const s=root.getAttribute('data-theme');return s?s==='dark':matchMedia('(prefers-color-scheme:dark)').matches;};
const paint=()=>tb.innerHTML=svg(isDark()?I.sun:I.moon);
tb.addEventListener('click',()=>{root.setAttribute('data-theme',isDark()?'light':'dark');paint();});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paint);
paint();
</script>
</body>
</html>
