<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>강정크루즈여객터미널 서귀포 관광 안내</title>
<meta name="description" content="강정크루즈여객터미널에서 출발하는 서귀포 4개 테마 코스·12개 명소 관광 안내" />
<meta name="theme-color" content="#f47920" />
<style>
  :root{
    --font-sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

    --bg:#ffffff;
    --bg-soft:#f5f7f8;
    --surface:#ffffff;
    --surface-2:#f7f8fa;
    --border:#e8ebee;
    --border-strong:#d5dae0;
    --ink:#20252a;
    --ink-2:#4a525a;
    --muted:#8a929b;
    --brand:#f47920;      /* 제주 감귤 오렌지 */
    --brand-2:#dd6510;
    --brand-soft:#fff2e6;
    --teal:#0ca6a0;       /* 보조 — 바다 */
    --teal-soft:#e4f6f5;
    --ok:#2f9e44;--ok-bg:#ebfbee;--no:#b3bac1;--no-bg:#f1f3f5;
    --shadow:0 1px 2px rgba(30,40,50,.04),0 8px 24px -14px rgba(30,40,50,.16);
    --shadow-lg:0 20px 48px -22px rgba(30,40,50,.32);
    --thead:#2b3138;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216;--bg-soft:#14181d;--surface:#171b21;--surface-2:#1d2229;--border:#282e36;--border-strong:#39414b;
      --ink:#eef1f4;--ink-2:#c4ccd3;--muted:#8b949d;--brand:#ff8a3d;--brand-2:#ff9a55;--brand-soft:#3a2413;
      --teal:#2bc4bd;--teal-soft:#10312f;--ok:#40c463;--ok-bg:#12301c;--no:#5a636b;--no-bg:#20252c;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.6);
      --shadow-lg:0 24px 56px -26px rgba(0,0,0,.75);--thead:#252b33;
    }
  }
  :root[data-theme="light"]{
    --bg:#ffffff;--bg-soft:#f5f7f8;--surface:#ffffff;--surface-2:#f7f8fa;--border:#e8ebee;--border-strong:#d5dae0;
    --ink:#20252a;--ink-2:#4a525a;--muted:#8a929b;--brand:#f47920;--brand-2:#dd6510;--brand-soft:#fff2e6;
    --teal:#0ca6a0;--teal-soft:#e4f6f5;--ok:#2f9e44;--ok-bg:#ebfbee;--no:#b3bac1;--no-bg:#f1f3f5;
    --shadow:0 1px 2px rgba(30,40,50,.04),0 8px 24px -14px rgba(30,40,50,.16);
    --shadow-lg:0 20px 48px -22px rgba(30,40,50,.32);--thead:#2b3138;
  }
  :root[data-theme="dark"]{
    --bg:#0f1216;--bg-soft:#14181d;--surface:#171b21;--surface-2:#1d2229;--border:#282e36;--border-strong:#39414b;
    --ink:#eef1f4;--ink-2:#c4ccd3;--muted:#8b949d;--brand:#ff8a3d;--brand-2:#ff9a55;--brand-soft:#3a2413;
    --teal:#2bc4bd;--teal-soft:#10312f;--ok:#40c463;--ok-bg:#12301c;--no:#5a636b;--no-bg:#20252c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.6);
    --shadow-lg:0 24px 56px -26px rgba(0,0,0,.75);--thead:#252b33;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:1.65;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  img{max-width:100%;display:block}
  a{color:var(--brand-2)}
  :focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,28px)}

  /* header */
  .topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid var(--border)}
  .topbar-inner{display:flex;align-items:center;gap:10px;height:58px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;letter-spacing:-.02em}
  .logo .mk{width:30px;height:30px;flex:none;color:#fff;background:var(--brand);border-radius:9px;display:grid;place-items:center}
  .logo .mk svg{width:18px;height:18px}
  .logo b{color:var(--brand)}
  .logo small{color:var(--muted);font-weight:600;font-size:12.5px;letter-spacing:0}
  .tbtn{margin-left:auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
  .tbtn:hover{color:var(--ink);border-color:var(--border-strong)}
  .tbtn svg{width:18px;height:18px}

  /* course tabs */
  .tabs{position:sticky;top:58px;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);
    backdrop-filter:saturate(150%) blur(12px);-webkit-backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid var(--border)}
  .tabs-inner{display:flex;gap:6px;overflow-x:auto;padding:9px 0;scrollbar-width:none}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{flex:none;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;letter-spacing:-.01em;
    display:flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;transition:.15s}
  .tab:hover{border-color:var(--brand);color:var(--brand-2)}
  .tab .n{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--brand)}
  .tab[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
  .tab[aria-current="true"] .n{color:rgba(255,255,255,.9)}

  /* hero — basalt hexagon editorial */
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border);background:var(--bg)}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.65}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 86% -15%, color-mix(in srgb,var(--brand) 22%,transparent), transparent 60%),
              radial-gradient(115% 105% at -8% 118%, color-mix(in srgb,var(--teal) 15%,transparent), transparent 55%)}
  .hero-inner{position:relative;z-index:2;padding-block:clamp(44px,9vw,92px) clamp(34px,6vw,60px)}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-2);margin-bottom:18px}
  .eyebrow::before{content:"";width:26px;height:2px;background:currentColor;border-radius:2px}
  h1.title{margin:0;font-size:clamp(32px,7.5vw,60px);line-height:1.06;font-weight:900;letter-spacing:-.03em;text-wrap:balance;color:var(--ink)}
  h1.title em{font-style:normal;color:var(--brand)}
  .lede{margin:20px 0 0;max-width:37em;font-size:clamp(15px,2.3vw,18px);color:var(--ink-2);line-height:1.68;text-wrap:pretty}

  /* course */
  .course{padding:clamp(38px,6vw,64px) 0}
  .course:nth-child(even){background:var(--bg-soft)}
  .c-head{display:flex;gap:14px;align-items:flex-start}
  .c-num{flex:none;font-family:var(--font-mono);font-weight:800;font-size:15px;color:#fff;background:var(--brand);
    border-radius:10px;padding:7px 11px;letter-spacing:.02em;box-shadow:0 8px 18px -8px var(--brand)}
  .c-kicker{font-size:12.5px;font-weight:800;color:var(--brand-2);letter-spacing:.04em;text-transform:uppercase}
  .course h2{margin:3px 0 0;font-size:clamp(21px,4vw,30px);font-weight:900;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}

  .routemap{margin:22px 0 6px;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
  .routemap figcaption{font-size:12.5px;color:var(--muted);padding:9px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:7px}
  .routemap figcaption svg{width:15px;height:15px;color:var(--brand)}
  .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:16px 0 6px;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
  .route .node{color:var(--ink);white-space:nowrap}
  .route .node.start{color:var(--brand-2)}
  .route .leg{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
  .route .leg svg{width:14px;height:14px;color:var(--brand);flex:none}
  .route .leg svg.ar{color:var(--muted)}

  /* place — Visit Jeju detail style */
  .place{margin:26px 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;
    padding:clamp(16px,3vw,26px);box-shadow:var(--shadow);scroll-margin-top:118px}
  .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:16px}
  .crumb svg{width:13px;height:13px;opacity:.6}
  .crumb b{color:var(--ink-2)}

  .detail{display:grid;grid-template-columns:1fr;gap:22px}
  @media(min-width:800px){.detail{grid-template-columns:1.05fr .95fr;gap:30px;align-items:start}}

  .dgallery{display:flex;flex-direction:column;gap:10px}
  .dgallery .main{border:0;padding:0;margin:0;cursor:zoom-in;background:var(--surface-2);border-radius:14px;overflow:hidden;display:block}
  .dgallery .main img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .5s}
  .dgallery .main:hover img{transform:scale(1.03)}
  .thumbs{display:flex;gap:10px}
  .thumbs button{flex:1;border:2px solid transparent;padding:0;margin:0;cursor:pointer;background:var(--surface-2);border-radius:10px;overflow:hidden}
  .thumbs button img{width:100%;aspect-ratio:16/10;object-fit:cover;opacity:.72;transition:.18s}
  .thumbs button.active{border-color:var(--brand)}
  .thumbs button.active img,.thumbs button:hover img{opacity:1}

  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .cat{font-size:12px;font-weight:800;color:var(--brand-2);background:var(--brand-soft);padding:5px 11px;border-radius:999px}
  .place h3{margin:0;font-size:clamp(22px,4.5vw,29px);font-weight:900;letter-spacing:-.025em;line-height:1.22}
  .p-tag{margin:8px 0 0;color:var(--muted);font-size:14px;font-weight:600}
  .p-desc{margin:16px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.8;text-wrap:pretty}

  .quickacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .act{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-size:13px;font-weight:700;
    padding:10px 15px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--ink);transition:.15s}
  .act:hover{border-color:var(--border-strong);transform:translateY(-1px)}
  .act.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .act.primary:hover{background:var(--brand-2)}
  .act svg{width:15px;height:15px}
  .act[aria-disabled="true"]{opacity:.45;pointer-events:none}

  /* info list (icon rows) */
  .sect-t{display:flex;align-items:center;gap:9px;margin:26px 0 12px;font-size:15px;font-weight:900;letter-spacing:-.01em}
  .sect-t::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:3px}
  .infolist{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .infolist li{display:grid;grid-template-columns:22px 88px 1fr;gap:10px;align-items:start;padding:12px 16px}
  .infolist li+li{border-top:1px solid var(--border)}
  .infolist .ic{color:var(--brand);margin-top:2px}
  .infolist .ic svg{width:18px;height:18px}
  .infolist .k{color:var(--muted);font-size:13px;font-weight:700;padding-top:1px}
  .infolist .v{font-size:14px;color:var(--ink);word-break:break-word}
  .infolist .v a{color:var(--brand-2);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
  .infolist .v a:hover{text-decoration:underline}
  .infolist .v .note{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  .free{display:inline-block;font-size:12px;font-weight:800;color:var(--ok);background:var(--ok-bg);padding:2px 9px;border-radius:6px}

  /* facilities table */
  .facwrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px}
  .fac{width:100%;min-width:460px;border-collapse:collapse;font-size:13px}
  .fac thead th{background:var(--thead);color:#fff;font-weight:700;padding:10px 13px;text-align:left;font-size:12.5px}
  .fac thead th.c-ox{text-align:center;width:60px}
  .fac thead th.c-note{width:32%}
  .fac td,.fac th{border-bottom:1px solid var(--border);padding:10px 13px;vertical-align:middle}
  .fac tr:last-child td{border-bottom:0}
  .fac .grp{background:var(--surface-2);font-weight:800;width:116px;white-space:nowrap;color:var(--ink);border-right:1px solid var(--border)}
  .fac .item{color:var(--ink-2)}
  .fac .ox{text-align:center;width:60px;border-right:1px solid var(--border);border-left:1px solid var(--border)}
  .fac .ox .badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff}
  .fac .ox.on .badge{background:var(--ok)}
  .fac .ox.off .badge{background:var(--no)}
  .fac .ox .badge svg{width:14px;height:14px}
  .fac .bigo{color:var(--muted);font-size:12.5px}

  /* tags */
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
  .tag{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);
    padding:5px 11px;border-radius:999px}
  .tag b{color:var(--brand);font-weight:700}

  /* nearby */
  .nearby{margin-top:22px;padding-top:20px;border-top:1px dashed var(--border)}
  .nearby .lbl{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:10px}
  .nearby .chips{display:flex;flex-wrap:wrap;gap:8px}
  .nearby a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--surface-2);
    border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink);transition:.15s}
  .nearby a:hover{border-color:var(--brand);color:var(--brand-2)}
  .nearby a img{width:34px;height:34px;border-radius:8px;object-fit:cover}

  .note-src{margin:16px 2px 0;font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
  .note-src svg{width:14px;height:14px;flex:none;margin-top:2px}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(15,12,8,.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);cursor:default}
  .lb .close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;display:grid;place-items:center}
  .lb .close svg{width:20px;height:20px}

  footer{background:var(--bg-soft);border-top:1px solid var(--border);padding:34px 0 48px;color:var(--muted);font-size:13px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
  footer b{color:var(--ink-2)}
  .totop{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;color:var(--muted);font-weight:700;font-size:13px}
  .totop:hover{color:var(--ink)}
  .totop svg{width:15px;height:15px}

  @media(max-width:520px){.infolist li{grid-template-columns:20px 74px 1fr}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <span class="logo">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6.4-5.6 6.4-10.1A6.4 6.4 0 105.6 10.9C5.6 15.4 12 21 12 21z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="10.6" r="2.3" fill="currentColor"/></svg></span>
      <span>VISIT <b>서귀포</b></span> <small>관광 안내</small>
    </span>
    <button class="tbtn" id="themeBtn" aria-label="밝은/어두운 테마 전환" title="테마 전환"></button>
  </div>
</header>

<nav class="tabs" aria-label="코스 바로가기"><div class="wrap tabs-inner" id="tabs"></div></nav>

<section class="hero">
  <canvas id="hexcanvas" aria-hidden="true"></canvas>
  <div class="wrap hero-inner">
    <span class="eyebrow">강정크루즈여객터미널 · 서귀포</span>
    <h1 class="title">바다에서 내려,<br><em>서귀포</em>의 하루를 걷다</h1>
    <p class="lede">크루즈에서 막 내린 당신을 위한 4개의 테마 코스, 12곳의 명소. 화산 절벽과 폭포, 치유의 물길, 짜릿한 액티비티, 그리고 예술과 먹거리까지 — 터미널에서 가까운 순서대로 담았습니다. 전체 4시간 가량 소요됩니다.</p>
  </div>
</section>

<main id="app"></main>

<footer>
  <div class="wrap">
    <span>자료 출처 · <b>강정크루즈여객터미널 관광 안내</b></span>
    <span>운영시간·이용요금은 방문 전 각 명소 홈페이지에서 확인하시기 바랍니다.</span>
    <button class="totop" id="toTop">맨 위로 <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="close" id="lbClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <img id="lbImg" src="" alt="" />
</div>

<script>
const I={
  taxi:'<path d="M5 11l1.4-3.9A1.9 1.9 0 018.2 5.8h7.6a1.9 1.9 0 011.8 1.3L19 11m-14 0h14m-14 0a1.8 1.8 0 00-1.8 1.8v2.7a.9.9 0 00.9.9h1m13.8-5.4a1.8 1.8 0 011.8 1.8v2.7a.9.9 0 01-.9.9h-1M7.5 16.4h9M7 14h.01M17 14h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  walk:'<path d="M13.2 5.4a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM10.2 21l1.9-4.8-2.1-2.1.7-4.1 3.1 1.2 1.4 2.6M12 15.9l2.3 5.1M11.4 9.3L8.4 10.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  arrow:'<path d="M5 12h13m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  pin:'<path d="M12 21s6.4-5.6 6.4-10.1A6.4 6.4 0 105.6 10.9C5.6 15.4 12 21 12 21z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="10.6" r="2.3" stroke="currentColor" stroke-width="1.7"/>',

    tag:'바다로 직접 떨어지는 국내 유일 해안 폭포',
    desc:'국가 명승 제43호로, 육지의 폭포수가 바다로 직접 떨어지는 국내 유일의 해안 폭포입니다. 천제연·천지연과 함께 제주 3대 폭포로 꼽힙니다. 높이 23m의 두 줄기 물줄기가 해안 절벽에서 웅장한 소리를 내며 푸른 바다로 쏟아집니다. 진시황제 전설과 4.3사건의 역사가 함께 깃들어, 자연의 아름다움과 역사의 무게를 한 장소에서 느낄 수 있습니다.',
    addr:'서귀포시 칠십리로 214번길 37',hours:'09:00~17:50 (입장마감 17:30)',hoursNote:'계절별 운영시간 변동 · 방문 전 유선 문의 필수',
    tel:'+82-64-733-1530',url:'https://www.visitjeju.net/kr/detail/view?contentsid=CONT_000000000500531',tags:['폭포','해안폭포','명승','제주3대폭포'],
    fac:{응대:['O'],홍보:['O'],안내판:['O'],장애인:['X'],와이파이:['X'],제세동기:['O']}}
  ]}
];

const app=document.getElementById('app'),tabsEl=document.getElementById('tabs');
const bySlug={};COURSES.forEach(c=>c.stops.forEach(s=>{s._course=c;bySlug[s.slug]=s;}));

function facTable(s){
  let rows='';
  FAC_GROUPS.forEach(gr=>{
    const present=gr.items.filter(([k])=>s.fac[k]!==undefined);
    if(!present.length)return;
    present.forEach(([k,label],i)=>{
      const v=s.fac[k],on=v[0]==='O',note=v[1]||'';
      rows+='<tr>';
      if(i===0) rows+=`<td class="grp" rowspan="${present.length}">${gr.g}</td>`;
      rows+=`<td class="item">${label}</td><td class="ox ${on?'on':'off'}"><span class="badge">${svg(on?I.check:I.x)}</span></td><td class="bigo">${note}</td></tr>`;
    });
  });
  return `<div class="facwrap"><table class="fac"><thead><tr><th>항목</th><th>세부내용</th><th class="c-ox">O/X</th><th class="c-note">비고</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function infoRow(icon,k,v){return `<li><span class="ic">${svg(I[icon])}</span><span class="k">${k}</span><span class="v">${v}</span></li>`;}

function placeCard(s,idx){
  const img1=IMG(`img/${s.slug}-1.jpg`),img2=IMG(`img/${s.slug}-2.jpg`);
  const tel=s.tel?s.tel.replace(/[^0-9+]/g,''):'';
  const mapQ=encodeURIComponent(s.name+' '+s.addr);

  let info='';
  info+=infoRow('pin','주소',s.addr);
  info+=infoRow('clock','이용시간',(s.hours||'상세 정보 없음')+(s.hoursNote?`<span class="note">※ ${s.hoursNote}</span>`:''));
  if(s.tel) info+=infoRow('phone','문의',`<a href="tel:${tel}">${s.tel.replace('+82-','+82) ')}</a>${s.telNote?`<span class="note">${s.telNote}</span>`:''}`);
  info+=infoRow('ticket','이용요금',s.free?'<span class="free">무료</span>':'홈페이지 확인');
  if(s.url) info+=infoRow('link','홈페이지',`<a href="${s.url}" target="_blank" rel="noopener">공식 안내 페이지 열기</a>`);

  // nearby = other stops in same course
  const near=s._course.stops.filter(o=>o.slug!==s.slug).map(o=>
    `<a href="#p-${o.slug}"><img src="${IMG(`img/${o.slug}-1.jpg`)}" alt="" loading="lazy" />${o.name}</a>`).join('');

  return `<article class="place" id="p-${s.slug}">
    <nav class="crumb">홈 ${svg(I.chev)} 서귀포 ${svg(I.chev)} ${s.cat} ${svg(I.chev)} <b>${s.name}</b></nav>
    <div class="detail">
      <div class="dgallery">
        <button class="main" data-full="${img1}" aria-label="${s.name} 대표 사진 크게 보기"><img id="main-${s.slug}" src="${img1}" alt="${s.name} 대표 사진" /></button>
        <div class="thumbs" data-slug="${s.slug}">
          <button class="thumb active" data-src="${img1}" aria-label="사진 1"><img src="${img1}" alt="${s.name} 사진 1" loading="lazy" /></button>
          <button class="thumb" data-src="${img2}" aria-label="사진 2"><img src="${img2}" alt="${s.name} 사진 2" loading="lazy" /></button>
        </div>
      </div>
      <div class="dhead">
        <div class="cats"><span class="cat">${s.cat}</span><span class="cat" style="background:var(--teal-soft);color:var(--teal)">코스 ${s._course.num} · ${idx}번째</span></div>
        <h3>${s.name}</h3>
        <p class="p-tag">${s.tag}</p>
        <div class="quickacts">
          <a class="act primary" href="https://map.kakao.com/?q=${mapQ}" target="_blank" rel="noopener">${svg(I.map)}지도·길찾기</a>
          <a class="act" ${tel?`href="tel:${tel}"`:'aria-disabled="true"'}>${svg(I.phone)}전화</a>
          ${s.url?`<a class="act" href="${s.url}" target="_blank" rel="noopener">${svg(I.link)}홈페이지</a>`:''}
        </div>
        <p class="p-desc">${s.desc}</p>
      </div>
    </div>
    <div class="sect-t">기본정보</div>
    <ul class="infolist">${info}</ul>
    <div class="sect-t">편의시설 안내</div>
    ${facTable(s)}
    <div class="tags">${s.tags.map(t=>`<span class="tag"><b>#</b>${t}</span>`).join('')}</div>
    <div class="nearby"><div class="lbl">이 코스의 다른 명소</div><div class="chips">${near}</div></div>
    <p class="note-src">${svg(I.info)}O/X 및 운영 정보는 안내 자료 기준이며 변동될 수 있습니다. 방문 전 홈페이지·전화로 확인하시기 바랍니다.</p>
  </article>`;
}

COURSES.forEach(c=>{
  const tab=document.createElement('a');
  tab.className='tab';tab.href='#'+c.id;tab.dataset.course=c.id;
  tab.innerHTML=`<span class="n">${c.num}</span>${c.kicker}`;
  tabsEl.appendChild(tab);

  let route=`<span class="node start">${c.start}</span>`;
  c.stops.forEach(s=>{route+=`<span class="leg">${svg(I.arrow,'ar')}${svg(I[s.transit.m])}${s.transit.t}</span><span class="node">${s.name}</span>`;});

  const sec=document.createElement('section');
  sec.className='course';sec.id=c.id;sec.style.scrollMarginTop='118px';
  sec.innerHTML=`<div class="wrap">
    <div class="c-head"><span class="c-num">${c.num}</span><div><div class="c-kicker">${c.kicker}</div><h2>${c.title}</h2></div></div>
    <figure class="routemap"><img src="${IMG(c.map)}" alt="${c.title} 이동 경로 지도" loading="lazy" /><figcaption>${svg(I.map)}${c.start}에서 출발하는 이동 경로</figcaption></figure>
    <div class="route">${route}</div>
    ${c.stops.map((s,i)=>placeCard(s,i+1)).join('')}
  </div>`;
  app.appendChild(sec);
});

/* gallery thumb swap + lightbox */
const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg');
app.addEventListener('click',e=>{
  const th=e.target.closest('.thumbs .thumb');
  if(th){const box=th.closest('.thumbs'),slug=box.dataset.slug,src=th.dataset.src;
    document.getElementById('main-'+slug).src=src;
    th.closest('.dgallery').querySelector('.main').dataset.full=src;
    box.querySelectorAll('.thumb').forEach(t=>t.classList.toggle('active',t===th));return;}
  const mn=e.target.closest('.dgallery .main');
  if(mn){lbImg.src=mn.dataset.full;lbImg.alt='';lb.classList.add('on');}
});
function closeLb(){lb.classList.remove('on');lbImg.src='';}
lb.addEventListener('click',e=>{if(e.target===lb||e.target.closest('.close'))closeLb();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});

/* scrollspy */
const tabLinks=[...tabsEl.querySelectorAll('.tab')];
const spy=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){
  const id=en.target.id;tabLinks.forEach(t=>t.setAttribute('aria-current',t.dataset.course===id));
  const a=tabLinks.find(t=>t.dataset.course===id);if(a)a.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}});
},{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('.course').forEach(s=>spy.observe(s));
document.getElementById('toTop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));

/* theme */
const root=document.documentElement,tb=document.getElementById('themeBtn');
const isDark=()=>{const s=root.getAttribute('data-theme');return s?s==='dark':matchMedia('(prefers-color-scheme:dark)').matches;};
const paint=()=>tb.innerHTML=svg(isDark()?I.sun:I.moon);
tb.addEventListener('click',()=>{root.setAttribute('data-theme',isDark()?'light':'dark');paint();drawHex();});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{paint();drawHex();});
paint();

/* hero basalt-hexagon canvas (주상절리 모티프) */
const cv=document.getElementById('hexcanvas'),ctx=cv.getContext('2d');
function hexAt(cx,cy,r){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i),px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();ctx.stroke();}
function drawHex(){
  const host=cv.parentElement,dpr=Math.min(devicePixelRatio||1,2),w=host.clientWidth,h=host.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=isDark()?'rgba(255,180,120,.10)':'rgba(70,60,50,.09)';ctx.lineWidth=1;
  const R=27,dx=R*1.5,dy=R*Math.sqrt(3);
  for(let col=-1,x=0;x<w+R;col++,x=col*dx){const off=(col%2)?dy/2:0;for(let y=-R;y<h+R;y+=dy) hexAt(x,y+off,R);}
}
addEventListener('resize',drawHex);drawHex();
</script>
