    marks+=`<g>
      <circle cx="${x}" cy="${y}" r="16" fill="var(--accent)"/>
      <text x="${x}" y="${y+5}" text-anchor="middle" class="mnum">${i+1}</text>
      <text x="${x}" y="${ly}" text-anchor="middle" class="mlbl">${MAP_LABEL[c.stops[i].slug]}</text>
    </g>`;
  });
  // route legend (below map) — avoids in-map clutter/overlaps
  let legend=`<span class="lg-node lg-start">강정항</span>`;
  c.stops.forEach((s,i)=>{
    legend+=`<span class="lg-leg">${s.transit.replace('약 ','')}</span><span class="lg-arrow">→</span><span class="lg-node">${MAP_LABEL[s.slug]}</span>`;
  });
  return `<figure class="mapfig"><div class="mapbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title} 이동 경로 지도">
    <defs><linearGradient id="sea-${c.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity="0.10"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0.22"/>
    </linearGradient></defs>
    <rect width="${W}" height="${H}" fill="var(--paper)"/>
    <path d="M0,300 C160,275 300,320 430,300 C560,282 690,318 ${W},296 L${W},${H} L0,${H} Z" fill="url(#sea-${c.id})"/>
    <path d="M0,300 C160,275 300,320 430,300 C560,282 690,318 ${W},296" fill="none" stroke="var(--accent)" stroke-opacity="0.45" stroke-width="1.5"/>
    <g stroke="var(--accent)" stroke-opacity="0.18" stroke-width="1.2" fill="none">
      <path d="M40,348 q22,-9 44,0 t44,0 t44,0 t44,0"/><path d="M560,362 q22,-9 44,0 t44,0 t44,0 t44,0"/>
    </g>
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-dasharray="2 7" stroke-linecap="round"/>
    ${marks}
    <g transform="translate(${W-48},46)" stroke="var(--ink-2)" fill="none" stroke-width="1.4">
      <circle r="15"/><path d="M0,-10 L4,3 L0,0 L-4,3 Z" fill="var(--ink-2)" stroke="none"/>
      <text x="0" y="-18" text-anchor="middle" class="mcompass">N</text>
    </g>
    <text x="24" y="${H-20}" class="mwm">SEOGWIPO</text>
  </svg></div>
  <figcaption class="cap route-legend">${legend}</figcaption>
  </figure>
  <style>
    .mnum{font:800 15px var(--sans);fill:#fff}
    .mlbl{font:700 15.5px var(--sans);fill:var(--ink)}
    .mcompass{font:700 10px var(--sans);fill:var(--muted)}
    .mwm{font:italic 700 20px var(--serif);fill:var(--accent);opacity:.35;letter-spacing:.08em}
    .route-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-top:12px}
    .route-legend .lg-node{font-weight:700;color:var(--ink);font-size:13px}
    .route-legend .lg-start{color:var(--accent)}
    .route-legend .lg-leg{font-size:11.5px;color:var(--muted);font-weight:600}
    .route-legend .lg-arrow{color:var(--accent);font-weight:700}
  </style>`;
}

function facList(s){
  const items=FAC_ORDER.filter(k=>s.fac[k]!==undefined).map(k=>{
    const v=s.fac[k],on=v[0]==='O',note=v[1]||'';
    return `<li class="${on?'on':'off'}"><span class="mk">${svg(on?I.check:I.x)}</span><span>${FAC_LABEL[k]}${note?` <span class="fnote">· ${note}</span>`:''}</span></li>`;
  }).join('');
  return `<div class="fac"><div class="sidebar"><div class="h" style="border:0;padding:0;margin:0 0 10px">편의시설 안내</div></div><ul>${items}</ul></div>`;
}

function stopArticle(s,i){
  const tel=s.tel?s.tel.replace(/[^0-9+]/g,''):'';
  const mapQ=encodeURIComponent(s.name+' '+s.addr);
  const img1=IMG(`img/${s.slug}-1.jpg`),img2=IMG(`img/${s.slug}-2.jpg`);
  let note='';
  note+=`<div><dt>주소</dt><dd>${s.addr}</dd></div>`;
  note+=`<div><dt>이용시간</dt><dd class="mono">${s.hours}</dd></div>`;
  if(s.tel) note+=`<div><dt>문의</dt><dd class="mono"><a href="tel:${tel}">${s.tel.replace('+82-','+82) ')}</a>${s.telNote?` <span style="color:var(--muted)">(${s.telNote})</span>`:''}</dd></div>`;
  note+=`<div><dt>이용요금</dt><dd>${s.free?'<span class="free">무료</span>':'홈페이지 확인'}</dd></div>`;
  note+=`<div><dt>가는 길</dt><dd>강정크루즈여객터미널에서 ${s.transit}</dd></div>`;

  return `<article class="place" id="p-${s.slug}">
    <div class="subkick">${String(i+1).padStart(2,'0')} · ${s.cat}</div>
    <h3>${s.head}</h3>
    <p class="lede">${s.name}</p>
    <figure class="big"><img src="${img1}" alt="${s.name}" data-zoom loading="lazy"><figcaption class="cap">${s.cap1}</figcaption></figure>
    <div class="body-col"><p class="${i===0?'drop':''}">${s.desc}</p></div>
    ${s.pull?`<blockquote class="pull">“${s.pull}”</blockquote>`:''}
    <div class="spread">
      <figure class="ph"><img src="${img2}" alt="${s.name}" data-zoom loading="lazy"><figcaption class="cap">${s.cap2}</figcaption></figure>
      <div class="sidebar">
        <div class="block"><div class="h">Travel Note</div><dl>${note}</dl>
          <div class="acts">
            <a class="btn fill" href="https://map.kakao.com/?q=${mapQ}" target="_blank" rel="noopener">${svg(I.pin)}지도</a>
            <a class="btn" ${tel?`href="tel:${tel}"`:'aria-disabled="true"'}>${svg(I.phone)}전화</a>
            ${s.url?`<a class="btn" href="${s.url}" target="_blank" rel="noopener">${svg(I.link)}홈페이지</a>`:''}
          </div>
        </div>
        <div class="block">${facList(s)}</div>
      </div>
    </div>
    <div class="tags">${s.tags.map(t=>`<span>#${t}</span>`).join('')}</div>
    <div class="place-div"></div>
  </article>`;
}

/* build */
document.getElementById('coverImg').src=IMG('img/jeongbang-2.jpg');
const nav=document.getElementById('nav'),toc=document.getElementById('toc'),feats=document.getElementById('features');

COURSES.forEach(c=>{
  const a=document.createElement('a');a.href='#'+c.id;a.dataset.course=c.id;
  a.innerHTML=`<span class="n">${c.num}</span>${c.kicker}`;nav.appendChild(a);

  const row=document.createElement('a');row.className='toc-row';row.href='#'+c.id;
  row.innerHTML=`<span class="no">${c.num}</span><img class="th" src="${IMG('img/'+c.stops[0].slug+'-1.jpg')}" alt=""><span class="tt"><b>${c.title}</b><span>${c.stops.map(s=>s.name.split(' ')[0]).join(' · ')}</span></span><span class="pg">p.${c.page}</span>`;
  toc.appendChild(row);
});

feats.innerHTML=COURSES.map((c,ci)=>`
  <div class="rule"></div>
  <section class="feature" id="${c.id}">
    <div class="feat-lead">
      <span class="eyebrow">Feature ${c.num} · ${c.kicker}</span>
      <h2>${c.title}</h2>
      <p>${c.intro}</p>
    </div>
    ${routeMap(c)}
    ${c.stops.map((s,i)=>stopArticle(s,i)).join('')}
  </section>`).join('');

/* lightbox */
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg');
document.body.addEventListener('click',e=>{
  const z=e.target.closest('[data-zoom]');
  if(z&&z.tagName==='IMG'){lbimg.src=z.src;lb.classList.add('on');return;}
});
const closeLb=()=>{lb.classList.remove('on');lbimg.src='';};
lb.addEventListener('click',e=>{if(e.target===lb||e.target.closest('.x'))closeLb();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});

/* scrollspy */
const navLinks=[...nav.querySelectorAll('a')];
const spy=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){
  const id=en.target.id;navLinks.forEach(t=>t.setAttribute('aria-current',t.dataset.course===id));
  const act=navLinks.find(t=>t.dataset.course===id);if(act)act.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}});},{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('.feature').forEach(s=>spy.observe(s));
document.getElementById('toTop').addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));

/* theme */
const root=document.documentElement,tb=document.getElementById('themeBtn');
const isDark=()=>{const s=root.getAttribute('data-theme');return s?s==='dark':matchMedia('(prefers-color-scheme:dark)').matches;};
const paint=()=>tb.innerHTML=svg(isDark()?I.sun:I.moon);
tb.addEventListener('click',()=>{root.setAttribute('data-theme',isDark()?'light':'dark');paint();});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paint);
paint();
</script>
</body>
</html>
