# 커뮤니티 소스 정의 — 발굴팀(community-scout)이 참조
# access_note는 2026-07-06 원격 환경 기준 관찰. 환경 네트워크 정책에 따라 달라짐.

sites:
  fmkorea:
    name: 에펨코리아
    boards:
      - name: 포텐 터짐
        url: https://www.fmkorea.com/best
      - name: 포텐 터짐 (일간)
        url: https://www.fmkorea.com/index.php?mid=best&listStyle=list
    hot_signals: [추천수, 댓글수, 포텐 등록 시각]
    access_note: 안티봇 매우 강함. 요청 간격 3초 이상, 차단 시 즉시 검색 폴백.

  ruliweb:
    name: 루리웹
    boards:
      - name: 베스트 (유머 BEST)
        url: https://bbs.ruliweb.com/best/humor
      - name: 베스트 전체
        url: https://bbs.ruliweb.com/best
    hot_signals: [추천수, 댓글수]
    access_note: 비교적 접근 쉬운 편.

  dcinside:
    name: 디시인사이드
    boards:
      - name: 실시간 베스트
        url: https://gall.dcinside.com/board/lists/?id=dcbest
      - name: 초개념 갤러리
        url: https://gall.dcinside.com/board/lists/?id=superidea
    hot_signals: [개념글 등록, 댓글수, 조회수]
    access_note: UA 없는 요청은 차단. 데스크톱 브라우저 UA 필수.

  # 네이버 뿜은 2020년 서비스 종료 → 목록에서 제거함.

  theqoo:
    name: 더쿠
    boards:
      - name: 핫게시판
        url: https://theqoo.net/hot
    hot_signals: [조회수, 댓글수]
    access_note: Rhymix/XE 기반이라 본문 구조가 에펨과 유사(div.xe_content).
      연예·이슈 여초 커뮤. 논란 확산 빠름. 셀렉터 실전 미검증.

  nate:
    name: 네이트판
    boards:
      - name: 오늘의 톡 랭킹
        url: https://pann.nate.com/talk/ranking
    hot_signals: [추천수, 댓글수]
    access_note: 렉카 소재 1순위. 사연·썰·vs 논쟁의 본진.
      본문 #contentArea. 셀렉터 실전 미검증.

  bobae:
    name: 보배드림
    boards:
      - name: 베스트 게시판
        url: https://www.bobaedream.co.kr/board/bulletin/list.php?code=best
    hot_signals: [추천수, 댓글수]
    access_note: 남초, 자동차·블랙박스 영상·사회 이슈. 남녀·정치 논쟁 소재.
      본문 div.bodyCont. 셀렉터 실전 미검증.

  mlbpark:
    name: MLBPARK 불펜
    boards:
      - name: 불펜
        url: https://mlbpark.donga.com/mp/b.php?b=bullpen
    hot_signals: [추천수, 댓글수]
    access_note: 남초, 야구+사회 이슈 논쟁 활발.
      본문 div.ar_txt. 셀렉터 실전 미검증.

  blind:
    name: 블라인드
    boards:
      - name: 토픽 (공개 웹)
        url: https://www.teamblind.com/kr/topics
    hot_signals: [좋아요, 댓글수]
    access_note: 로그인 필수 서비스. 공개 미리보기 + WebSearch 간접 수집만.
      로그인 우회·계정 사용 금지. 수집량이 적은 것이 정상.

selection:
  per_site_candidates: 6   # 사이트당 후보 수
  final_count: 8           # 최종 선정 수
  categories: [인기글, vs논쟁, 댓글유발]
