<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>here - 실시간 위치</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E53935'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-family='Arial Black' font-size='36' font-weight='900' fill='white'%3ESOS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- /t/:code 로 접속해도 깨지지 않도록 자산은 모두 루트 절대 경로로 참조한다. -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="map"></div>

  <div class="map-controls">
    <button type="button" id="followButton" class="map-button active">🎯 따라가기 켜짐</button>
    <button type="button" id="fitButton" class="map-button">🗺 전체 경로 보기</button>
  </div>

  <div class="status-panel">
    <div class="status-header">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-label" id="statusLabel">연결 중...</div>
    </div>
    <div class="user-name" id="userName">—</div>
    <div class="meta-row">
      <div class="meta-item">
        <div class="meta-label">마지막 업데이트</div>
        <div class="meta-value" id="lastUpdate">—</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">이동 거리</div>
        <div class="meta-value" id="distance">0 m</div>
      </div>
      <div class="meta-item">
        <div class="meta-label">최근 속도</div>
        <div class="meta-value" id="speed">—</div>
      </div>
    </div>
    <div class="filtered-note hidden" id="filteredNote"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <div class="overlay-icon" id="overlayIcon">⏳</div>
      <div class="overlay-title" id="overlayTitle">불러오는 중...</div>
      <div class="overlay-desc" id="overlayDesc"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
